[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imdp_phm"
version = "0.4.0"
description = "Condition-Based Maintenance under Imprecise Self-Exciting Jump-Diffusion Degradation"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "torch>=2.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pytest>=8.0.0"
]
